# ACK PR-loop lane for joefeser/who-decides.
# The v0.2 policy adds only `dev` as the development/owner-handoff target.
# `main`, `master`, and release branches remain human-mediated.
agentControl:
  requiredVersion: ">=0.5.1 <0.6.0"
  channel: stable
  allowPrerelease: false
  requiredCapabilities:
    - requiredReviewerBatching
    - runPrLoopUntilTerminal
    - quietJson
    - freshnessGate
    - onboardDoctor
    - onboardExplain
    - onboardWorkerPrompt
    - releaseProvenance

lane:
  id: joefeser-who-decides-pr-review-loop
  version: 0.2.0
  status: active
  description: Hackathon development PRs target dev; promotion to main remains a separate owner-mediated PR using merge commits, never squash.

prLoopPacket:
  repo: joefeser/who-decides
  costProfile: small_team
  policyProfile: default

  reviewFreshnessPolicy:
    # Two policy-controlled fresh Codex fix/review cycles (recommendation);
    # request ceilings are configured separately per bot below.
    maxFreshReviewFixCycles: 2
    # Repo-accurate (the generator's auth/**/migrations/** defaults do not
    # exist here). Reconciled against the recommendation's list plus scripts/**.
    riskyFileGlobs:
      - .agent-control/**
      - .github/workflows/**
      # The console UI and API routes ARE the approval boundary's front door
      # (run/decision/reset/replay handlers drive the engine in src/server).
      - app/**
      - schemas/**
      - scripts/**
      - src/consumption/**
      - src/live-loop.ts
      - src/live-loop/**
      - src/server/**
      - src/artifacts/**
      - src/provider.ts
      - src/gate-bedrock.ts
      - package.json
      - package-lock.json

  reviewQuorum:
    enabled: false
    groups:
      trustedCodeReview:
        bots:
          - codex
          - qodo
        minimumReturned: 1
        preferAllReturned: false
        waitForAllTimeoutSeconds: 900
        noneReturnedStopReason: REQUIRED_REVIEW_QUORUM_NOT_MET

  pushPolicy:
    mode: batch_until_review_settles
    localFixesPresent: false
    validationEvidence: []
    findingUrls: []
    waitTimeoutSeconds: 900

  bots:
    codex:
      requirement: required
      waitUntilReturnedBeforeProcessing: true
      waitTimeoutSeconds: 900
      requestAllowed: policy
      requestRetryCeiling: 2
      retryCooldownSeconds: 120
    # Qodo sunset 2026-09-07 (owner decision): the reviewer is leaving the
    # platform. Disabled rather than removed so the lane's history and the
    # bot's past reviews remain legible. Codex is now the sole required
    # reviewer; the batch invariant applies to it alone.
    qodo:
      requirement: disabled
      waitUntilReturnedBeforeProcessing: false
    gemini:
      requirement: disabled
      waitUntilReturnedBeforeProcessing: false
    sourcery:
      requirement: disabled
      waitUntilReturnedBeforeProcessing: false

  branchPolicy:
    overnightAllowedMergeTargets:
      - dev
    overnightForbiddenMergeTargets:
      - main
      - master
      - release/**
    ownerOverrideEligibleTargets:
      - dev
    ownerOverrideDeniedTargets:
      - main
      - master
      - release/**
    mainPromotionRequiresSeparatePr: true
    mainPromotionOwnerOnly: true
    mergeMethod: merge_commit

  ownerOverrideAutoMerge:
    enabled: false
    residualRiskCeiling: medium
