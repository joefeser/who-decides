name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run test:console
      - run: npm run test:artifacts
      - run: npm run test:consumption
      - run: npm run scenario
      - run: npm run proof:consumption -- .tmp/consumption-proof
      - uses: actions/upload-artifact@v4
        with:
          name: consumption-proof-${{ github.event.pull_request.head.sha || github.sha }}
          path: .tmp/consumption-proof/result.json
          if-no-files-found: error
          retention-days: 7
